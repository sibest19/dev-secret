name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub release
      id-token: write # sign build provenance
      attestations: write # store build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches VERSION in bin/dev-secret
        run: |
          version="$(make -s version)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION=$version in bin/dev-secret"
            exit 1
          fi

      - run: brew install bats-core shellcheck shfmt
      - run: make check

      - name: Build release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          git archive --format=tar.gz --prefix="dev-secret-$version/" -o "dist/dev-secret-$version.tar.gz" "$GITHUB_REF_NAME"
          cp bin/dev-secret dist/dev-secret
          cp install.sh dist/install.sh
          (cd dist && shasum -a 256 dev-secret-*.tar.gz dev-secret install.sh >SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Attest build provenance
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dev-secret-*.tar.gz
            dist/dev-secret
            dist/install.sh

      # Scorecard's Signed-Releases check only looks at release asset names, not
      # at the attestations API: *.intoto.jsonl counts as SLSA provenance.
      - name: Add provenance bundle to release assets
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "$BUNDLE_PATH" "dist/dev-secret-$version.intoto.jsonl"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

      - name: Print Homebrew formula values
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dev-secret-${version}.tar.gz"
          sha256="$(shasum -a 256 "dist/dev-secret-${version}.tar.gz" | cut -d' ' -f1)"
          {
            echo "### Homebrew formula"
            echo '```ruby'
            echo "url \"$url\""
            echo "sha256 \"$sha256\""
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
